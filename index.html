<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pilih Portofolio Developer</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: "#0a0612",
              panel: "#150c24",
              panelBorder: "#2a1c42",
              accent: "#c084fc",
              accent2: "#f472b6",
              muted: "#a99bc4",
            },
            fontFamily: {
              display: ["Syne", "sans-serif"],
              body: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      @keyframes floaty {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-14px);
        }
      }
      .float-el {
        animation: floaty 6s ease-in-out infinite;
      }
      .vertical-text {
        writing-mode: vertical-rl;
      }
      @media (prefers-reduced-motion: reduce) {
        .float-el {
          animation: none;
        }
      }
    </style>
  </head>

  <body class="bg-bg text-white font-body antialiased overflow-x-hidden">
    <!-- Ambient background glow -->
    <div class="fixed inset-0 pointer-events-none">
      <div
        class="absolute top-[-10%] left-[15%] w-[420px] h-[420px] bg-accent/25 rounded-full blur-[120px]"
      ></div>
      <div
        class="absolute bottom-[-15%] right-[10%] w-[460px] h-[460px] bg-accent2/20 rounded-full blur-[130px]"
      ></div>
      <div
        class="absolute top-[35%] right-[30%] w-[300px] h-[300px] bg-orange-400/10 rounded-full blur-[110px]"
      ></div>
    </div>

    <!-- Navbar -->
    <header class="fixed top-0 left-0 w-full z-50">
      <div
        class="max-w-6xl mx-auto px-6 md:px-10 h-20 flex items-center justify-between"
      >
        <span class="font-display font-bold text-lg tracking-tight"
          >dev.folio</span
        >

        <nav
          class="hidden md:flex items-center gap-8 text-sm text-muted font-medium"
        >
          <a href="#top" class="hover:text-white transition-colors">Beranda</a>
          <a href="#pilih" class="hover:text-white transition-colors"
            >Portofolio</a
          >
          <a
            href="https://github.com/"
            target="_blank"
            rel="noopener"
            class="hover:text-white transition-colors"
            >GitHub</a
          >
        </nav>

        <div
          class="hidden sm:flex items-center gap-1 bg-panel/70 backdrop-blur-md border border-panelBorder rounded-full p-1"
        >
          <a
            href="fadhlan.html"
            target="_self"
            class="px-4 py-2 text-xs font-semibold rounded-full text-muted hover:text-white transition-colors"
            >Fadhlan</a
          >
          <a
            href="fatah.html"
            class="px-4 py-2 text-xs font-semibold rounded-full bg-gradient-to-r from-accent to-accent2 text-black"
            >Fattah</a
          >
        </div>
      </div>
    </header>

    <main
      id="top"
      class="relative min-h-screen flex flex-col items-center justify-center px-6 text-center pt-24 pb-16"

        class="hidden md:block vertical-text absolute left-8 top-1/2 -translate-y-1/2 text-xs tracking-[0.3em] text-muted"
        >2026</span

      <!-- vertical social icons -->

            <path

            />
          </svg>
        </a>
      </div>

      <!-- giant faded background word -->
      <span
        class="absolute font-display font-extrabold text-[20vw] leading-none text-white/5 select-none pointer-events-none whitespace-nowrap"
        >PORTOFOLIO</span
      >

      <!-- central visual -->
      <div class="relative float-el mb-10">
        <div
          class="absolute inset-0 bg-gradient-to-br from-accent via-accent2 to-orange-400 rounded-full blur-[90px] opacity-40 scale-90"
        ></div>
        <!-- Ganti src di bawah dengan file gambar elemen tengah yang sudah kamu siapkan -->
        <img
          src="assets/This_Changed_My_Life_As_Programmer-removebg-preview.png"
          alt="Elemen visual utama"
          class="relative w-52 h-52 sm:w-72 sm:h-72 md:w-80 md:h-80 object-contain drop-shadow-2xl"
        />
      </div>

      <!-- headline -->
      <h1
        class="relative font-display font-extrabold text-4xl sm:text-5xl md:text-6xl tracking-tight max-w-3xl"
      >
        Portofolio Kelas Pemrograman Web
      </h1>
      <p class="relative mt-5 text-muted text-base md:text-lg max-w-md">
        Dua sudut pandang, satu semangat belajar. Pilih portofolio yang ingin
        kamu jelajahi.
      </p>

      <!-- CTA -->
      <div
        id="pilih"
        class="relative mt-10 flex flex-col sm:flex-row items-center justify-center gap-4"
      >
        <a
          href="fadhlan.html"
          class="w-64 py-4 rounded-full font-semibold text-sm bg-gradient-to-r from-accent to-accent2 text-black shadow-lg shadow-accent/30 hover:scale-[1.03] transition-transform text-center"
        >
          Fadhlan Ilhami
        </a>
        <a
          href="fatah.html"
          class="w-64 py-4 rounded-full font-semibold text-sm bg-panel/70 backdrop-blur-md border border-panelBorder text-white hover:border-accent/60 transition-colors text-center"
        >
          Muhammad Fattahurriky
        </a>
      </div>
    </main>

    <footer class="relative text-center pb-8 text-xs text-muted/70">
      &copy; 2026 &mdash; Tugas Pemrograman Web
    </footer>
  </body>
</html>
